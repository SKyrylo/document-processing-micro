name: doc-processing-micro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [db]
  
  migrate:
    build:
      context: ./nest-service
      target: build
    command: ["npx", "prisma", "db", "migrate"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [db]

  nest:
    build: 
      context: ./nest-service
      target: dev
    ports:
      - "127.0.0.1:3000:3000"
    env_file: ./nest-service/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(res => res.json()).then(data => process.exit(data.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./nest-service:/app
      - /app/node_modules
    restart: unless-stopped
    networks: [db, app]
    init: true
  
  next:
    build: 
      context: ./next-service
      target: dev
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3000
    environment:
      - API_URL=http://nest:3000
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      nest:
        condition: service_healthy
    volumes:
      - ./next-service:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(res => res.json()).then(data => process.exit(data.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
    restart: unless-stopped
    networks: [app]
    init: true

networks:
  db:
  app:

volumes:
  postgres_data: